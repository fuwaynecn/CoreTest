services:
  math-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: math-trainer
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
    networks:
      - fuword_default
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  fuword_default:
    external: true
